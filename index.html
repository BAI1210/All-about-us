<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我们的新篇章</title>
    <style>
        body {
            background-color: #fdf5f2; /* 奶油色背景 */
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: white;
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(214, 139, 139, 0.1);
            text-align: center;
            max-width: 500px;
            animation: fadeIn 2s;
        }
        h1 { color: #d68b8b; margin-bottom: 10px; }
        .heart { font-size: 50px; color: #d68b8b; animation: pulse 1.5s infinite; }
        .text { color: #7a7a7a; line-height: 2; font-size: 1.1em; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">❤️</div>
        <h1>All About Us</h1>
        <div class="text">
            这里是我们新生活的起点。<br>
            虽然房子有过去，<br>
            但此刻起，每一寸空气都属于我们的未来。<br>
            <br>
            <strong>正在加载更多美好...</strong>
        </div>
    </div>
</body>
</html>
